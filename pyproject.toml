[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baselinetrading"
version = "0.1.0"
description = "Learning project: an intraday trading bot that has to beat three baselines, net of costs, before it may trade."
readme = "README.md"
requires-python = ">=3.11"
# Module 1 uses only the standard library. Market data and broker packages are
# added with the modules that need them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
