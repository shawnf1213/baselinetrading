[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baselinetrading"
version = "0.1.0"
description = "Learning project: an intraday trading bot that has to beat three baselines, net of costs, before it may trade."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.44,<1",  # Alpaca market data and (paper) trading
    "tzdata",               # time zone database, needed for America/New_York on Windows
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
